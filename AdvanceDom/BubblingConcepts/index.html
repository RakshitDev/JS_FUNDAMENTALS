<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Selector</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="theme-app">
      <div class="theme-container">
        <h1>Choose a Theme</h1>
        <p class="subtitle">Click a button to explore different themes.</p>

        <div class="theme-buttons">
          <button class="theme-btn" data-theme="light">☀️ Light</button>

          <button class="theme-btn" data-theme="dark">🌙 Dark</button>

          <button class="theme-btn" data-theme="blue">🌊 Blue</button>
        </div>
      </div>

      <div class="theme-content theme-content--light">
        <span class="icon">☀️</span>
        <h2>Light Theme</h2>
        <p>A clean and bright theme that's perfect for daytime use.</p>
      </div>

      <div class="theme-content theme-content--dark">
        <span class="icon">🌙</span>
        <h2>Dark Theme</h2>
        <p>A comfortable dark theme that's easy on your eyes at night.</p>
      </div>

      <div class="theme-content theme-content--blue">
        <span class="icon">🌊</span>
        <h2>Blue Theme</h2>
        <p>A calm blue theme inspired by the sky and ocean.</p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
